name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run db:generate
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Compiler le paquet partagé
        run: npm run build --workspace=@cave/shared

      - name: Typecheck
        run: npm run typecheck

      # Les tests des parsers tournent sur des captures HTML réelles de Vivino.
      # C'est cette étape qui détectera un changement de leur markup — auquel cas
      # l'ajout de bouteille se dégraderait silencieusement en production.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build de l'image
    runs-on: ubuntu-latest
    # Vérifie que le Dockerfile reste valide sur les PR, sans publier d'image.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
